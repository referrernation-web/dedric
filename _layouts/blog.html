<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% if page.layout == 'post' %}{{ page.title }} | Dedric Brown{% else %}Blog | Dedric Brown — Salesforce, GTM Systems &amp; AI{% endif %}</title>
<meta name="description" content="{{ page.description | default: 'Notes on Salesforce roadmaps, GTM business systems and putting AI on top of clean data, by Dedric Brown.' | escape }}">
<link rel="canonical" href="{{ site.url }}{{ page.url }}">
{% if page.hidden %}<meta name="robots" content="noindex,nofollow">{% endif %}
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta property="og:title" content="{{ page.title | default: 'Blog' | escape }}">
<meta property="og:description" content="{{ page.description | default: 'Notes on Salesforce, GTM systems and AI.' | escape }}">
<meta property="og:url" content="{{ site.url }}{{ page.url }}">
<meta property="og:image" content="{{ site.url }}{{ page.cover | default: '/assets/og.jpg' }}">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Arial' font-weight='700' font-size='34' fill='%23AAFF00'%3ED%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Serif+Display&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#050507;--surf:#14131d;--line:rgba(255,255,255,.1);--txt:#FAFAFA;--body:#d6d3e2;--mut:#a9a6b8;--acc:#6C2BD9;--lime:#AAFF00}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font:400 16px/1.6 'Space Grotesk',ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
.bar{position:fixed;top:0;left:0;height:3px;width:0;background:var(--lime);z-index:20}
.nav{position:sticky;top:0;z-index:10;background:rgba(5,5,7,.82);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav div{max-width:1100px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:22px}
.nav b{font:400 20px/1 'DM Serif Display',Georgia,serif;margin-right:auto}.nav b a{text-decoration:none}
.nav a.l{font-size:14px;color:var(--mut);text-decoration:none}.nav a.l:hover,.nav a.l.on{color:var(--txt)}
.cta{font-weight:600;font-size:14px;color:#0a1400;background:linear-gradient(180deg,#b8ff2a,#8fd400);padding:9px 16px;border-radius:999px;text-decoration:none;white-space:nowrap}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
.mono{font:600 12px/1 'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--lime)}
/* index */
.bhead{padding:72px 0 36px;text-align:center}.bhead h1{color:var(--lime);font:400 clamp(36px,6vw,58px)/1.08 'DM Serif Display',Georgia,serif;margin:14px 0}
.bhead p{color:var(--mut);max-width:620px;margin:0 auto;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:22px;padding:20px 0 90px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;text-decoration:none;transition:transform .2s,border-color .2s}
.card:hover,.card:focus-visible{transform:translateY(-4px);border-color:var(--lime)}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#0e0d16}
.card .noimg{aspect-ratio:16/9;background:radial-gradient(120% 120% at 0 0,#2c4200,#0e0d16 60%);display:flex;align-items:flex-end;padding:18px;font:400 22px/1.15 'DM Serif Display',Georgia,serif;color:var(--lime)}
.card .in{padding:20px;display:flex;flex-direction:column;gap:10px;flex:1}
.card h2{font-size:21px;font-weight:700;line-height:1.25;letter-spacing:-.01em}.card p{color:var(--mut);font-size:14.5px;flex:1}
.meta{font:400 12px/1 'JetBrains Mono',monospace;color:var(--mut);letter-spacing:.04em}
.card.first{grid-column:1/-1;flex-direction:row}.card.first>img,.card.first>.noimg{width:55%;aspect-ratio:auto;min-height:300px}.card.first h2{font-size:30px}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:60px 0;border:1px dashed var(--line);border-radius:22px}
/* article: about 66 characters per line, 18px+ body, 1.75 leading */
.art{max-width:720px;margin:0 auto;padding:56px 20px 40px}
.art .back{font-size:14px;color:var(--mut);text-decoration:none}.art .back:hover{color:var(--txt)}
.art h1{color:var(--lime);font:400 clamp(34px,5.4vw,52px)/1.1 'DM Serif Display',Georgia,serif;margin:18px 0 16px;letter-spacing:-.01em}
.art .dek{font-size:20px;line-height:1.5;color:var(--mut);margin-bottom:22px}
.by{display:flex;align-items:center;gap:12px;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:34px}
.by img{width:44px;height:44px;border-radius:50%;object-fit:cover}.by b{display:block;font-size:15px}.by .meta{margin-top:5px;display:block}
.cover{width:100%;border-radius:18px;margin-bottom:34px;display:block}
.prose{font-size:19px;line-height:1.75;color:var(--body)}
.prose>*+*{margin-top:1.25em}
.prose h2{font:700 28px/1.25 'Space Grotesk',sans-serif;color:var(--txt);margin-top:2em;letter-spacing:-.015em;scroll-margin-top:80px}
.prose h3{font:700 22px/1.3 'Space Grotesk',sans-serif;color:var(--txt);margin-top:1.7em;scroll-margin-top:80px}
.prose a{color:var(--lime);text-underline-offset:3px}.prose strong{color:var(--txt)}
.prose ul,.prose ol{padding-left:1.3em}.prose li+li{margin-top:.5em}
.prose blockquote{border-left:3px solid var(--lime);padding:4px 0 4px 20px;color:var(--txt);font:400 24px/1.4 'DM Serif Display',Georgia,serif}
.prose img{max-width:100%;border-radius:14px}
.prose code{font:400 .85em 'JetBrains Mono',monospace;background:var(--surf);padding:2px 6px;border-radius:6px}
.prose pre{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:18px;overflow:auto}.prose pre code{background:none;padding:0}
.prose table{width:100%;border-collapse:collapse;font-size:16px;display:block;overflow-x:auto}.prose th,.prose td{border-bottom:1px solid var(--line);padding:10px 12px;text-align:left}
.prose hr{border:0;border-top:1px solid var(--line);margin:2.2em 0}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:40px}.tags span{font:400 12px/1 'JetBrains Mono',monospace;border:1px solid rgba(170,255,0,.35);border-radius:999px;padding:7px 12px;color:var(--lime)}
.abox{margin-top:44px;background:var(--surf);border:1px solid var(--line);border-radius:22px;padding:26px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.abox img{width:72px;height:72px;border-radius:50%;object-fit:cover}.abox div{flex:1;min-width:240px}.abox p{color:var(--mut);font-size:15px;margin-top:4px}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:28px}.pn a{border:1px solid var(--line);border-radius:16px;padding:16px;text-decoration:none;font-weight:600;font-size:15px}.pn a:hover{border-color:var(--lime)}.pn small{display:block;color:var(--mut);font-weight:400;margin-bottom:4px}.pn a:last-child{text-align:right}
.foot{border-top:1px solid var(--line);color:var(--mut);font-size:14px;padding:26px 20px;text-align:center;margin-top:60px}.foot a{color:var(--txt)}
:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
@media(max-width:760px){.card.first{flex-direction:column}.card.first>img,.card.first>.noimg{width:100%;min-height:0;aspect-ratio:16/9}.prose{font-size:17.5px}.nav a.l.h{display:none}.pn{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.card{transition:none}}
</style>
</head><body>
<div class="bar" id="bar"></div>
<nav class="nav"><div><b><a href="/">Dedric Brown.</a></b><a class="l h" href="/#about">About</a><a class="l h" href="/#projects">Projects</a><a class="l on" href="/blog/">Blog</a><a class="cta" href="https://calendly.com/dbrowntech15/30min" target="_blank" rel="noopener">Book a call</a></div></nav>
{{ content }}
<footer class="foot">&copy; {{ 'now' | date: '%Y' }} Dedric Brown &middot; <a href="/">Home</a> &middot; <a href="/blog/">Blog</a> &middot; <a href="https://www.linkedin.com/in/dbrowntech" target="_blank" rel="noopener">LinkedIn</a></footer>
<script>(function(){var b=document.getElementById('bar'),a=document.querySelector('.prose');if(!a)return;addEventListener('scroll',function(){var r=a.getBoundingClientRect(),t=r.height-innerHeight*.6;b.style.width=Math.max(0,Math.min(1,-r.top/t))*100+'%'},{passive:true})})();</script>
</body></html>
